name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build

      # GitHub Pages обслуговує корінь гілки main.
      # Копіюємо збірку dist/ у корінь і комітимо з [skip ci],
      # щоб не запускати цей же workflow по колу.
      - name: Deploy dist to repo root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r dist/index.html index.html
          cp -r dist/.nojekyll .nojekyll
          rm -rf assets
          mkdir -p assets
          cp -r dist/assets/* assets/
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Deploy build to repo root"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
